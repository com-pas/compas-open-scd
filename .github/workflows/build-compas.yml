name: Build and push Azure image

on:
  push:
    branches:
      - 'main'
      - 'release/**'
      - 'feature/**'
      - 'brand/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          submodules: 'true'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: true

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v6
        with:
          node-version: '24.x'

      - name: Build application with pnpm
        timeout-minutes: 15
        run: |
          pnpm ci
          pnpm run-script build

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Login to Azure Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4
        with:
          registry: compasacr.azurecr.io
          username: CompasAcr
          password: ${{ secrets.AZURE_GITHUB_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        with:
          context: .
          file: distribution/Dockerfile
          push: true
          tags: compasacr.azurecr.io/compas-bearingpoint/open-scd:${{ env.COMMIT_SHORT_SHA }}
